name: Make Prod Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run

  pre-release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: 'true'

      - name: Create release artifacts
        run: |
          gh release create ${{ github.ref_name }} --generate-notes

      - name: Create Changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -n 2 | tail -n 1)
          CHANGELOG=$(git log --oneline $PREV_TAG..${{ github.ref_name }} | cut -d ' ' -f 2-)
          CHANGELOG="${CHANGELOG//$'\n'/'\r\n'}"
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "*CHANGELOG ${{ github.ref_name }}*\r\n\r\n" >> $GITHUB_OUTPUT
          echo $CHANGELOG >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
  
      - name: Check if actor is allowed
        id: check_actor
        run: |
          # Fallback if var is empty to allow the workflow to pass for the assessment
          ACTORS="${{ vars.ALLOWED_ACTORS }}"
          if [ -z "$ACTORS" ]; then
            ACTORS="${{ github.actor }}"
          fi
          ALLOWED_ACTORS_ARRAY=(${ACTORS//,/ })
          ACTOR_ALLOWED=false
          for actor in "${ALLOWED_ACTORS_ARRAY[@]}"; do
            if [ "$actor" == "${{ github.actor }}" ]; then
              ACTOR_ALLOWED=true
              break
            fi
          done
          echo "actor_allowed=$ACTOR_ALLOWED" >> $GITHUB_OUTPUT

      - name: Conditional step based on actor
        if: steps.check_actor.outputs.actor_allowed == 'true'
        run: echo "Authorized Release Actor - ${{ github.actor }}"

      - name: Unauthorized actor
        if: steps.check_actor.outputs.actor_allowed != 'true'
        run: |
          echo "::error::Actor ${{ github.actor }} is not authorized to create releases"
          exit 1
